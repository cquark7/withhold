name: withhold releases cache experiment

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [tool-cache, modules-only]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Cache the installed Go toolchain
        if: matrix.mode == 'tool-cache'
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/go/1.26.10
          key: benchmark-go-tool-macos-x64-1.26.10-v1
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          cache: ${{ matrix.mode == 'tool-cache' }}
      - name: Cache only Go modules
        if: matrix.mode == 'modules-only'
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: benchmark-go-mod-macos-x64-${{ hashFiles('go.sum') }}
      - name: Test native Go behavior
        run: go mod verify && go test ./... -count=1 && go vet ./...
      - name: Build twice and compare reproducibility
        run: |
          python tools/package_native.py --version v0.0.0 --targets darwin-amd64 --output artifacts
          python tools/package_native.py --version v0.0.0 --targets darwin-amd64 --output rebuild
          cmp artifacts/SHA256SUMS rebuild/SHA256SUMS
      - name: Verify and execute the extracted archive
        run: python tools/verify_native.py --artifacts artifacts --version v0.0.0 --targets darwin-amd64 --extract extracted --run
      - name: Build loopback acceptance fixture
        run: CGO_ENABLED=0 go build -trimpath -o fixture ./tests/nativefixture
      - name: Show cache sizes
        run: du -sh "$(go env GOCACHE)" "$(go env GOMODCACHE)" "$(go env GOMODCACHE)/cache/download" "$RUNNER_TOOL_CACHE/go/1.26.10"
